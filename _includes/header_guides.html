<!-- _includes/header.html -->
<header class="site-header">
    <nav class="site-nav">
      <div class="nav-wrapper">
        <!-- Site title/logo -->
        <a href="{{ site.baseurl }}/" class="site-title">
          {% if site.title %}{{ site.title }}{% else %}Your Name{% endif %}
        </a>
  
        <!-- Navigation menu -->
        <ul class="nav-links">

        <!-- Home page ka href, already handled by the space button,
         clicking upon space redirects you to the home page -->

        <!-- Guides home page, this page -->
          <li>
            <a 
            href="{{ site.baseurl }}/guides/" {% if page.url == '/guides/' %}class="active"{% endif %}>
                Guides
            </a>
        </li>

        <!-- Computer Science Topics -->
          <li>
            <a 
            href="{{ site.baseurl }}/guides/cs/" {% if page.url == '/guides/cs/' %}class="active"{% endif %}>
                CS
            </a>
        </li>

        <!-- Self domain notes -->
          <li>
            <a 
            href="{{ site.baseurl }}/guides/ml/" {% if page.url == '/guides/ml/' %}class="active"{% endif %}>
                Everything ML
            </a>
        </li>
        
        <!-- Cool stuff written by others -->
          <li>
            <a 
            href="{{ site.baseurl }}/guides/byothers" {% if page.url == '/guides/byothers/' %}class="active"{% endif %}>
                by Others
            </a>
        </li>
        
        <!-- Academic notes, how to survive through college -->
        <li>
            <a 
            href="{{ site.baseurl }}/guides/acad" {% if page.url == '/guides/acad/' %}class="active"{% endif %}>
                acads ?
            </a>
        </li>    


        </ul>
      </div>
    </nav>
  </header>
  
  <!-- Keep the same styles as before -->
  <style>
  /* Previous styles remain unchanged */
  .site-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    width: 100%;
    padding: 1rem 0;
    background-color: #f8f9fa;
    border-bottom: 1px solid #e9ecef;
    z-index: 1000;
  }
  
  .site-nav {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 2rem;
    box-sizing: border-box;
  }
  
  .nav-wrapper {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
  }
  
  .site-title {
    font-size: 1.5rem;
    font-weight: bold;
    text-decoration: none;
    color: #333;
    white-space: nowrap;
    padding-right: 2rem;
  }
  
  .nav-links {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    flex-grow: 1;
    gap: clamp(1rem, 4vw, 4rem);
  }
  
  .nav-links li {
    white-space: nowrap;
  }
  
  .nav-links a {
    text-decoration: none;
    color: #666;
    font-weight: 500;
    transition: color 0.2s;
    padding: 0.5rem 1rem;
  }
  
  .nav-links a:hover {
    color: #333;
  }
  
  .nav-links a.active {
    color: #007bff;
  }
  
  body {
    padding-top: 70px;
    min-height: 100vh;
    position: relative;
    margin: 0;
  }
  
  @media (max-width: 768px) {
    .nav-wrapper {
      flex-direction: column;
      gap: 1rem;
    }
    
    .site-title {
      padding-right: 0;
    }
    
    .nav-links {
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
    }
  
    .nav-links a {
      padding: 0.5rem;
    }
  
    body {
      padding-top: 135px;
    }
  }
  </style>
